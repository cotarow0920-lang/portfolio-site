<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kotaro Wataki</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <p>Kotaro Wataki</p>
            <nav>
                <a href="#about">About</a>
                <a href="#works">Works</a>
            </nav>
        </header>
        <main>
            <section id="top">
            
                <img src="./media/yakionigiri.jpeg" width="40%" alt="Kotaro Wataki">
                <h1>
                    Kotaro Wataki<br>
                    Portfolio
                </h1>
            </section>
            <section id="about">
                <h3>About</h3>
                <p>
                    渡木　冴太朗<br>

                    好きな料理：ボロネーゼ、しょうゆラーメン

                <h3>Works</h3>
                <div class="works-controls">
                    <select id="category">
                        <option value="all">すべてのカテゴリ</option>
                    </select>
                    <select id="sort">
                        <option value="new">新しい順</option>
                        <option value="old">古い順</option>

                    </select>
                </div>
                <div id="works-grid"></div>

        <footer>
            <span>@ 2026 Kotaro Wataki</span>
        </footer>
        <script src="works.js"></script>
